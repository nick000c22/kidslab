<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kids Lab Basics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one lesson at a time. Question on top, grapes in the middle to count or move, big answer buttons at the bottom. */
:root {
  --bg: #EAF1FB; --bg-2: #DCE8F7; --ink: #1E2240; --muted: #5B6188; --card: #FFFFFF; --rim: #D5DDEE;
  --grape: #6E44A8; --leaf: #2F9358; --sun: #E9A21F; --berry: #D4466F; --sky: #2F7FC6; --tang: #E26A2C;
  --shadow: rgba(30, 34, 64, .22);
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141830; --bg-2: #1B2042; --ink: #EEF0FB; --muted: #A9AFD3; --card: #232850; --rim: #353B6B;
    --grape: #8A5FCB; --leaf: #3AAA69; --sun: #E3A630; --berry: #DC5A81; --sky: #3E8FD6; --tang: #E57A3E;
    --shadow: rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141830; --bg-2: #1B2042; --ink: #EEF0FB; --muted: #A9AFD3; --card: #232850; --rim: #353B6B;
  --grape: #8A5FCB; --leaf: #3AAA69; --sun: #E3A630; --berry: #DC5A81; --sky: #3E8FD6; --tang: #E57A3E;
  --shadow: rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-weight: 700;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overflow-x: hidden;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--sun); outline-offset: 4px; }
.screen {
  min-height: 100%; max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 16px;
  padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { width: 100%; min-height: 64px; display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
.chip { display: flex; align-items: center; gap: 6px; height: 52px; padding: 0 18px 0 12px; background: var(--card); border-radius: 26px;
  box-shadow: 0 5px 0 var(--shadow); font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }

.block {
  --c: var(--grape); border: 0; color: #fff; background: var(--c); border-radius: 24px;
  box-shadow: 0 9px 0 color-mix(in srgb, var(--c) 62%, #000), 0 14px 22px var(--shadow); transition: transform .09s, box-shadow .09s;
  font-family: var(--display); font-weight: 800; font-size: clamp(1.3rem, 3vw, 1.8rem); padding: 14px 28px;
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-shadow: 0 2px 0 rgba(0,0,0,.18); position: relative; overflow: hidden;
}
.block::before { content: ""; position: absolute; inset: 0 0 55% 0; background: linear-gradient(rgba(255,255,255,.22), transparent); pointer-events: none; }
.block:active { transform: translateY(7px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 62%, #000), 0 4px 10px var(--shadow); }
.c-grape { --c: var(--grape); } .c-leaf { --c: var(--leaf); } .c-sun { --c: var(--sun); } .c-berry { --c: var(--berry); } .c-sky { --c: var(--sky); } .c-tang { --c: var(--tang); }

/* menu */
.hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 8px; }
.hero .big-emoji { font-size: clamp(80px, 16vw, 130px); line-height: 1; }
.hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 7vw, 4rem); line-height: 1; margin: 0; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); font-size: 1.2rem; max-width: 36ch; text-wrap: balance; }
.done-tag { background: var(--leaf); color: #fff; border-radius: 999px; padding: 4px 14px; font-size: 1rem; }
.modes { width: min(720px, 100%); display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); margin-top: 10px; }
.mode { min-height: 190px; }
.mode .m-emoji { font-size: 60px; line-height: 1.1; text-shadow: none; }
.mode .m-sub { font-family: var(--body); font-size: 1rem; text-shadow: none; opacity: .92; }

/* game */
.tag { color: var(--muted); font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; margin-top: -40px; }
.dots { display: flex; gap: 10px; }
.dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: inset 0 0 0 3px var(--rim); color: #fff; font-size: 1.1rem; }
.dot.now { box-shadow: inset 0 0 0 4px var(--sun); }
.dot.yes { background: var(--leaf); box-shadow: none; }
.prompt { font-family: var(--display); font-weight: 800; font-size: clamp(1.6rem, 4.6vw, 2.6rem); line-height: 1.1; margin: 0; text-align: center; text-wrap: balance; max-width: 22ch; }
.sum { font-family: var(--display); font-weight: 800; font-size: clamp(2.6rem, 9vw, 4.6rem); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.sum .gap { display: inline-block; min-width: 1.2em; border-bottom: 6px solid var(--sun); color: var(--sun); text-align: center; }
.visual { width: min(820px, 100%); min-height: 120px; background: var(--card); border-radius: 28px; box-shadow: 0 8px 0 var(--shadow);
  padding: 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 18px; position: relative; }
.say { min-height: 2.4em; max-width: 34ch; text-align: center; text-wrap: balance; font-family: var(--display); font-weight: 700; font-size: clamp(1.25rem, 3vw, 1.7rem); line-height: 1.2; margin: 0; }
.say.good { color: var(--leaf); } .say.bad { color: var(--berry); }
.choices { width: min(820px, 100%); display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.choices .block { font-size: clamp(2rem, 6vw, 3rem); padding: 16px 10px; min-height: 96px; font-variant-numeric: tabular-nums; }
.choices .block.wrong { --c: #9AA0B8; opacity: .55; }
.choices .block.right { --c: var(--leaf); }
.actions { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; min-height: 10px; }

/* grapes and things */
.g { width: 40px; height: 40px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; border: 0; padding: 0;
  background: radial-gradient(circle at 34% 30%, #EBDDFB 0 10%, #A577DE 34%, #5B2E95 100%); box-shadow: inset -2px -3px 0 rgba(40, 10, 80, .25);
  color: #fff; font-family: var(--display); font-size: 1.1rem; text-shadow: 0 1px 0 rgba(0,0,0,.4); animation: pop .35s cubic-bezier(.3,1.6,.5,1) both; }
.g.green { background: radial-gradient(circle at 34% 30%, #E9FBD9 0 10%, #8FD26A 34%, #3E8A2A 100%); box-shadow: inset -2px -3px 0 rgba(20, 60, 10, .25); }
.g.eaten { background: transparent; box-shadow: inset 0 0 0 3px var(--rim); animation: none; position: relative; }
.g.eaten::after { content: "✕"; color: var(--berry); font-size: 1.4rem; text-shadow: none; }
.g.empty { background: transparent; box-shadow: inset 0 0 0 3px var(--rim); animation: none; }
.g.tap { cursor: pointer; }
.g.counted { outline: 4px solid var(--sun); outline-offset: 2px; }
.small .g { width: 28px; height: 28px; font-size: .85rem; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.frame { display: grid; grid-template-columns: repeat(5, 44px); gap: 8px; padding: 10px; border-radius: 16px; background: var(--bg-2); }
.group { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-content: center; max-width: 230px; padding: 14px; border-radius: 22px; background: var(--bg-2); min-height: 80px; }
.op { font-family: var(--display); font-weight: 800; font-size: 3rem; color: var(--muted); }
.plate { width: clamp(84px, 14vw, 120px); aspect-ratio: 1 / 1; max-width: 100%; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 10px var(--rim), 0 6px 0 var(--shadow);
  display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; align-content: center; padding: 26%; }
.plate .g { width: 18px; height: 18px; }
.plates { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; width: 100%; }
.array { display: grid; gap: 8px; padding: 12px; border-radius: 18px; background: var(--bg-2); }
.array .g { width: 32px; height: 32px; }
.tens { display: flex; gap: 10px; align-items: flex-end; }
.ten { display: grid; grid-template-rows: repeat(10, 18px); gap: 3px; padding: 6px; border-radius: 12px; background: var(--sky); }
.ten span { width: 18px; height: 18px; border-radius: 50%; background: #fff; opacity: .9; }
.ones { display: flex; flex-wrap: wrap; gap: 6px; max-width: 120px; align-content: flex-end; }
.one { width: 22px; height: 22px; border-radius: 50%; background: var(--tang); }
.vlabel { font-family: var(--display); font-size: 1.2rem; color: var(--muted); text-align: center; width: 100%; }
.seq { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.seq span { min-width: 72px; height: 72px; padding: 0 8px; border-radius: 18px; background: var(--bg-2); display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 2.2rem; font-variant-numeric: tabular-nums; }
.seq span.gap { background: transparent; box-shadow: inset 0 0 0 4px var(--sun); color: var(--sun); }
.hop { font-size: 1.6rem; align-self: center; color: var(--muted); }
.cmp { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.cmp .num { font-family: var(--display); font-weight: 800; font-size: 3rem; line-height: 1; }

/* multi-part lessons */
.parts { width: min(860px, 100%); display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); margin-top: 6px; }
.parts .block { min-height: 130px; font-size: 1.35rem; text-wrap: balance; }
.parts .p-emoji { font-size: 44px; line-height: 1; text-shadow: none; }
.parts .p-sub { font-family: var(--body); font-size: .9rem; text-shadow: none; opacity: .92; }
/* text answers */
.choices.long { grid-template-columns: 1fr; width: min(640px, 100%); }
.choices.long .block { font-size: clamp(1.25rem, 3.2vw, 1.7rem); min-height: 70px; padding: 12px 18px; text-wrap: balance; }
.choices.wordy .block { font-size: clamp(1.4rem, 4vw, 2rem); }
/* keypad for writing numbers */
.choices.pad-mode { display: flex; justify-content: center; }
.pad { width: min(420px, 100%); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.pad-show { width: 100%; min-height: 88px; border-radius: 22px; background: var(--card); box-shadow: inset 0 0 0 4px var(--sun);
  font-family: var(--display); font-weight: 800; font-size: 3.4rem; display: grid; place-items: center; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.pad-show.empty { color: var(--muted); font-size: 1.4rem; letter-spacing: 0; }
.pad-keys { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pad-keys button { border: 0; border-radius: 18px; min-height: 70px; background: var(--card); box-shadow: 0 6px 0 var(--shadow);
  font-family: var(--display); font-weight: 800; font-size: 2.2rem; color: var(--ink); }
.pad-keys button:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--shadow); }
.pad-keys .k-del { color: var(--berry); font-size: 1.6rem; }
.pad-keys .k-ok { background: var(--leaf); color: #fff; font-size: 1.6rem; }
/* hundreds, tens and ones */
.hun { display: grid; grid-template-columns: repeat(10, 7px); gap: 2px; padding: 5px; border-radius: 8px; background: var(--grape); }
.hun span { width: 7px; height: 7px; border-radius: 2px; background: #fff; opacity: .85; }
.blocks { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: center; }
.blocks .tens .ten { grid-template-rows: repeat(10, 9px); gap: 2px; padding: 4px; border-radius: 8px; }
.blocks .tens .ten span { width: 9px; height: 9px; }
.blocks .hgroup { display: flex; flex-wrap: wrap; gap: 6px; max-width: 300px; justify-content: center; }
.strip { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.strip span { min-width: 110px; height: 90px; padding: 0 10px; border-radius: 20px; background: var(--bg-2); display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 2.6rem; font-variant-numeric: tabular-nums; }
.strip span.gap { background: transparent; box-shadow: inset 0 0 0 5px var(--sun); color: var(--sun); }
.strip span.me { background: var(--grape); color: #fff; }
.strip .arrow { min-width: 0; background: none; font-size: 1.8rem; color: var(--muted); padding: 0; }
.bignum { font-family: var(--display); font-weight: 800; font-size: clamp(4rem, 14vw, 7rem); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.words { font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 4.6vw, 2.4rem); text-align: center; text-wrap: balance; max-width: 26ch; }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgba(10, 12, 30, .5);
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { background: var(--card); border-radius: 28px; padding: 28px; width: min(560px, 100%); max-height: 100%; overflow-y: auto;
  text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35); display: flex; flex-direction: column; align-items: center; gap: 16px; }
.card h2 { font-family: var(--display); font-weight: 800; font-size: 2.4rem; margin: 0; line-height: 1; }
.card .big { font-size: 64px; line-height: 1; }
.card .rowb { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.fine { color: var(--muted); font-size: 1.05rem; margin: 0; text-wrap: balance; }
.grape-gain { font-family: var(--display); font-weight: 800; font-size: 1.6rem; background: var(--bg-2); border-radius: 999px; padding: 4px 18px; }
#fw { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 90; pointer-events: none; }
.wheel-wrap { position: relative; width: min(420px, 82vw, 60vh); aspect-ratio: 1 / 1; max-width: 100%; }
.wheel { width: 100%; height: 100%; display: block; }
.wheel-spin { transform-box: fill-box; transform-origin: center; }
.pointer { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); width: 0; height: 0; border-left: 22px solid transparent;
  border-right: 22px solid transparent; border-top: 40px solid var(--ink); z-index: 2; }
.prize-art { width: min(220px, 60vw); }
.prize-art svg { width: 100%; height: auto; }
@media (prefers-reduced-motion: reduce) { .g { animation: none; } }
</style>
</head>
<body>

<section class="screen" id="menu">
  <div class="top"><div class="chip"><span>🍇</span><span class="grape-count">0</span></div><div class="chip"><span>⭐</span><span class="star-count">0</span></div></div>
  <div class="hero">
    <div class="big-emoji" id="m-emoji"></div>
    <h1 id="m-title"></h1>
    <p id="m-intro"></p>
    <span class="done-tag" id="m-done" hidden>✓ Quiz done. Practise or take it again any time!</span>
  </div>
  <div class="parts" id="parts" hidden></div>
  <div class="modes">
    <button class="block mode c-sky" type="button" id="go-practice"><span class="m-emoji">🎯</span><span>Practice</span><span class="m-sub">As many as you like. 1 ⭐ each</span></button>
    <button class="block mode c-sun" type="button" id="go-quiz"><span class="m-emoji">📝🎡</span><span>Take the quiz</span><span class="m-sub" id="quiz-sub">Get 5 right: 🍇 5 grapes for your teddy!</span></button>
  </div>
</section>

<section class="screen" id="game" hidden>
  <div class="top"><div class="chip"><span>🍇</span><span class="grape-count">0</span></div><div class="chip"><span>⭐</span><span class="star-count">0</span></div></div>
  <div class="tag" id="tag"></div>
  <div class="dots" id="dots" hidden></div>
  <p class="prompt" id="prompt"></p>
  <div class="sum" id="sum" hidden></div>
  <div class="visual" id="visual"></div>
  <p class="say" id="say" aria-live="polite"></p>
  <div class="choices" id="choices"></div>
  <div class="actions" id="actions"></div>
</section>

<div class="overlay" id="reward" hidden>
  <div class="card">
    <div class="big">🏆</div>
    <h2 id="r-title">Quiz complete!</h2>
    <div class="grape-gain">+ 🍇 5 grapes &nbsp; + 🎟️ 2 gym tokens</div>
    <p class="fine" id="r-text"></p>
    <div class="rowb"><button class="block c-sun" type="button" id="r-spin" hidden>🎡 Spin!</button><button class="block c-leaf" type="button" id="r-ok">Yay! ▶</button></div>
  </div>
</div>

<div class="overlay" id="spin" hidden>
  <div class="card">
    <h2 id="spin-title">Spin for a prize!</h2>
    <div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><svg class="wheel" id="wheel" viewBox="-110 -110 220 220" role="img" aria-label="Prize wheel"></svg></div>
    <div class="rowb" id="spin-actions"></div>
  </div>
</div>

<div class="overlay" id="prize" hidden>
  <div class="card">
    <div id="prize-art"></div>
    <h2 id="prize-title"></h2>
    <p class="fine" id="prize-text"></p>
    <div class="rowb"><button class="block c-leaf" type="button" id="prize-ok">Yay! ▶</button></div>
  </div>
</div>

<canvas id="fw" hidden></canvas>

<script src="../config.js"></script>
<script src="../kit.js"></script>
<script src="../items.js"></script>
<script src="../pet.js"></script>
<script>
(function () {
  var K = window.KidsLab;
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  K.backButton();
  var me = K.player() || { name: "you", emoji: "🙂" };

  /* ---------- helpers ---------- */
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pickOne(a) { return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  // Answer buttons: the right answer plus nearby wrong ones.
  function options(ans, n, min, max, step) {
    n = n || 4; min = min == null ? 0 : min; max = max == null ? ans + 10 : max; step = step || 1;
    var set = [ans], tries = 0;
    while (set.length < n && tries++ < 200) {
      var d = (rnd(1, 3) * step) * (Math.random() < .5 ? -1 : 1), v = ans + d;
      if (v >= min && v <= max && set.indexOf(v) === -1) set.push(v);
    }
    for (var v2 = min; set.length < n && v2 <= max; v2 += step) if (set.indexOf(v2) === -1) set.push(v2);
    return set.sort(function (a, b) { return a - b; });
  }
  function grapes(n, cls) { var o = ""; for (var i = 0; i < n; i++) o += '<span class="g ' + (cls || "") + '" style="animation-delay:' + (reduce ? 0 : i * 25) + 'ms"></span>'; return o; }
  function frame(filled, total, cls) {
    var o = '<div class="frame">';
    for (var i = 0; i < total; i++) o += i < filled ? '<span class="g ' + (cls || "") + '"></span>' : '<span class="g empty"></span>';
    return o + "</div>";
  }
  function frames(n, cls) { var o = ""; for (var i = 0; i < n; i += 10) o += frame(Math.min(10, n - i), 10, cls); return o; }

  /* ---------- the lessons (easy to hard) ---------- */
  var LESSONS = {
    counting: {
      title: "Count the Grapes", emoji: "🔢", color: "grape", intro: "Tap each grape to count it.",
      gen: function (quiz) {
        var n = quiz ? rnd(6, 20) : rnd(3, 12);
        var vis = '<div class="row" style="max-width:520px">';
        for (var i = 0; i < n; i++) vis += '<button type="button" class="g tap" aria-label="grape"></button>';
        vis += "</div>";
        return { prompt: "How many grapes?", visual: vis, answer: n, choices: options(n, 4, 1, 20),
          explain: "There are " + n + " grapes. Tap each one and count out loud!", after: countTaps };
      }
    },
    compare: {
      title: "More or Less", emoji: "🐊", color: "leaf", intro: "The hungry crocodile always eats the bigger number!",
      gen: function (quiz) {
        var max = quiz ? 20 : 10, a = rnd(1, max), b; do { b = rnd(1, max); } while (b === a);
        var more = quiz ? Math.random() < .6 : true;
        var vis = '<div class="cmp"><div class="group small">' + grapes(a) + '</div><div class="num">' + a + '</div></div>' +
          '<div class="op">🐊</div>' +

      b.addEventListener("click", function () { choose(v, b); });
      c.appendChild(b);
    });
    K.say(Q.speak || (Q.prompt + (Q.sum ? " " + Q.sum.replace("?", "what").replace("−", "minus").replace("×", "times").replace("÷", "divided by") : "")));
  }

  // Writing a number: tap digits, then the tick.
  function keypad(c) {
    var typed = "";
    var pad = document.createElement("div"); pad.className = "pad";
    pad.innerHTML = '<div class="pad-show empty">Tap the numbers</div><div class="pad-keys"></div>';
    var showEl = pad.querySelector(".pad-show"), keys = pad.querySelector(".pad-keys");
    function draw() { showEl.textContent = typed || "Tap the numbers"; showEl.classList.toggle("empty", !typed); }
    ["1", "2", "3", "4", "5", "6", "7", "8", "9", "⌫", "0", "✓"].forEach(function (k) {
      var b = document.createElement("button"); b.type = "button"; b.textContent = k;
      if (k === "⌫") { b.className = "k-del"; b.setAttribute("aria-label", "Rub out"); }
      if (k === "✓") { b.className = "k-ok"; b.setAttribute("aria-label", "Check"); }
      b.addEventListener("click", function () {
        if (locked) return;
        if (k === "⌫") typed = typed.slice(0, -1);
        else if (k === "✓") { if (typed) choose(Number(typed), showEl); return; }
        else if (typed.length < 4) { typed = typed === "0" ? k : typed + k; blip(Number(k)); }
        draw();
      });
      keys.appendChild(b);
    });
    c.appendChild(pad);
    pad._clear = function () { typed = ""; draw(); };
    c._pad = pad;
  }
  function choose(v, btn) {
    if (locked) return;
    if (v === Q.answer) {
      locked = true; if (!Q.input) btn.classList.add("right");
      right++; K.addStars(1, LESSON_ID); K.recordAnswer(LESSON_ID, true); refreshChips(); K.celebrate(btn); blip(7);
      if (mode === "quiz") renderDots();
      var praise = pickOne(["That's right!", "Brilliant!", "Yes! Well done!", "Super!", "You got it!"]);
      if (mode === "quiz" && right >= QUIZ_N) { say(praise + " " + Q.explain, "good"); setTimeout(quizDone, 1400); return; }
      say(praise + " " + Q.explain, "good");
      setAction(mode === "quiz" ? "Next question ▶" : "Another one ▶", "leaf", next);
      if (mode === "practice") addAction("Back to menu", "sky", backToMenu);
    } else if (mode === "practice") {
      K.recordAnswer(LESSON_ID, false);
      if (Q.input) { $("choices")._pad._clear(); say("Not quite. " + (Q.hint || "Have another go!"), "bad"); return; }
      btn.classList.add("wrong"); btn.disabled = true;
      say("Not quite. Have another go!", "bad");
    } else {
      K.recordAnswer(LESSON_ID, false);
      locked = true; if (!Q.input) btn.classList.add("wrong");
      $("choices").querySelectorAll(".block").forEach(function (b) { if (b.textContent === String(Q.answer)) b.classList.add("right"); });
      say("Oops! The answer is " + (Q.answerText || Q.answer) + ". " + Q.explain, "bad");
      setAction("Try another one ▶", "leaf", next);
    }
  }
  function setAction(label, color, fn) { $("actions").innerHTML = ""; addAction(label, color, fn); }
  function addAction(label, color, fn) {
    var b = document.createElement("button"); b.type = "button"; b.className = "block c-" + color; b.textContent = label;
    b.addEventListener("click", fn); $("actions").appendChild(b);
  }
  function backToMenu() { show("menu"); refreshChips(); }

  /* ---------- quiz complete: grapes, tick, fireworks, spin ---------- */
  function quizDone() {
    K.addGrapes(5); K.addTokens(2); K.markDone(LESSON_ID); K.addStars(3, LESSON_ID); K.record("quiz_done", LESSON_ID);
    refreshChips();
    $("r-text").textContent = "Well done, " + me.name + "! You finished " + L.title + ". Your teddy gets 5 grapes and 2 gym tokens!" + (SPIN ? " And you get a spin!" : "");
    $("r-spin").hidden = !SPIN; $("r-ok").hidden = !!SPIN;
    $("reward").hidden = false;
    fireworks(4000);
    K.say("Quiz complete! Well done " + me.name + "! Five grapes and two gym tokens for your teddy!" + (SPIN ? " Now spin the wheel!" : ""));
    if (SPIN) K.record("test_passed", LESSON_ID);
  }
  // Basics give grapes only. Concepts and Special lessons also get the prize wheel.
  $("r-ok").addEventListener("click", function () { $("reward").hidden = true; backToMenu(); });
  $("r-spin").addEventListener("click", function () { $("reward").hidden = true; openWheel(); });

  function fireworks(ms) {
    var c = $("fw"); c.hidden = false;
    var ctx = c.getContext("2d"), dpr = window.devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var parts = [], cols = ["#FFD166", "#EF476F", "#06D6A0", "#8A5FCB", "#4CC9F0", "#FFFFFF"], end = Date.now() + (reduce ? 1200 : ms), nextBurst = 0;
    function burst() {
      var x = innerWidth * (0.15 + Math.random() * 0.7), y = innerHeight * (0.12 + Math.random() * 0.35), col = pickOne(cols), n = reduce ? 20 : 60;
      for (var i = 0; i < n; i++) { var a = (Math.PI * 2 * i) / n, sp = 2 + Math.random() * 4; parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, col: col }); }
      blip(rnd(0, 7));
    }
    (function frame() {
      var now = Date.now();
      if (now < end && now > nextBurst) { burst(); nextBurst = now + 380 + Math.random() * 300; }
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts = parts.filter(function (p) { return p.life > 0; });
      parts.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.vx *= 0.985; p.life -= 0.012; ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill(); });
      ctx.globalAlpha = 1;
      if (now < end || parts.length) requestAnimationFrame(frame); else c.hidden = true;
    })();
  }

  var PRIZES = [
    { id: "icecream", name: "an ice cream", title: "Ice cream!", emoji: "🍦", color: "#F2A7C3" },
    { id: "kiss", name: "a kiss from Mummy or Daddy", title: "A big kiss!", emoji: "💋", color: "#F6C453" },
    { id: "teddy", name: "Math Teddy", title: "Math Teddy!", emoji: "🧸", color: "#9BC9F0" }
  ];
  var SLICES = [0, 1, 2, 0, 1, 2], wheelAngle = 0, spinning = false;
  function openWheel() {
    var svg = $("wheel"), NS = "http://www.w3.org/2000/svg", n = SLICES.length, R = 100;
    svg.innerHTML = "";
    var g = document.createElementNS(NS, "g"); g.setAttribute("class", "wheel-spin"); g.id = "wheel-g";
    for (var i = 0; i < n; i++) {
      var a0 = (i / n) * 2 * Math.PI - Math.PI / 2, a1 = ((i + 1) / n) * 2 * Math.PI - Math.PI / 2, mid = (a0 + a1) / 2;
      var path = document.createElementNS(NS, "path");
      path.setAttribute("d", "M0 0 L" + R * Math.cos(a0) + " " + R * Math.sin(a0) + " A" + R + " " + R + " 0 0 1 " + R * Math.cos(a1) + " " + R * Math.sin(a1) + " Z");
      path.setAttribute("fill", PRIZES[SLICES[i]].color); path.setAttribute("stroke", "#FFFFFF"); path.setAttribute("stroke-width", "3");
      g.appendChild(path);
      var t = document.createElementNS(NS, "text"), tx = 64 * Math.cos(mid), ty = 64 * Math.sin(mid);
      t.setAttribute("x", tx); t.setAttribute("y", ty); t.setAttribute("text-anchor", "middle"); t.setAttribute("dominant-baseline", "central"); t.setAttribute("font-size", "34");
      t.setAttribute("transform", "rotate(" + (mid * 180 / Math.PI + 90) + " " + tx + " " + ty + ")");
      t.textContent = PRIZES[SLICES[i]].emoji; g.appendChild(t);
    }
    svg.appendChild(g);
    svg.insertAdjacentHTML("beforeend", '<circle r="103" fill="none" stroke="#1E2240" stroke-width="6"/><circle r="16" fill="#1E2240"/><text text-anchor="middle" dominant-baseline="central" font-size="16">⭐</text>');
    g.style.transform = "rotate(" + wheelAngle + "deg)";
    var a = $("spin-actions"); a.innerHTML = "";
    var b = document.createElement("button"); b.type = "button"; b.className = "block c-sun"; b.textContent = "🎡 Spin!";
    b.addEventListener("click", function () { b.disabled = true; b.style.opacity = ".5"; spinWheel(); });
    a.appendChild(b);
    $("spin-title").textContent = "Spin for a prize!";
    $("spin").hidden = false;
    K.say("Tap spin!");
  }
  function spinWheel() {
    if (spinning) return; spinning = true;
    var n = SLICES.length, slice = rnd(0, n - 1), target = slice * (360 / n) + 10 + Math.random() * 40;
    var finalAngle = wheelAngle - (wheelAngle % 360) + 360 * 6 + (360 - target), g = $("wheel-g"), dur = reduce ? 600 : 5200;
    g.style.transition = "transform " + dur + "ms cubic-bezier(.12,.67,.12,1)";
    requestAnimationFrame(function () { g.style.transform = "rotate(" + finalAngle + "deg)"; });
    $("spin-title").textContent = "Spinning…";
    var lastIdx = -1, t0 = performance.now();
    (function tick() {
      var m = getComputedStyle(g).transform;
      if (m && m !== "none") { var v = m.split("(")[1].split(")")[0].split(","), ang = Math.atan2(+v[1], +v[0]) * 180 / Math.PI, idx = Math.floor((((-ang) % 360 + 360) % 360) / (360 / n)); if (idx !== lastIdx) { if (lastIdx !== -1) blip(idx); lastIdx = idx; } }
      if (performance.now() - t0 < dur) requestAnimationFrame(tick);
    })();
    setTimeout(function () { wheelAngle = finalAngle; spinning = false; showPrize(PRIZES[SLICES[slice]]); }, dur + 250);
  }
  function showPrize(prize) {
    $("spin").hidden = true;
    $("prize-art").innerHTML = prize.id === "teddy" && window.KidsPet
      ? '<div class="prize-art">' + KidsPet.teddySVG(3, { fur: "brown", wear: { face: "glasses" } }) + "</div>"
      : '<div class="big" style="font-size:120px">' + prize.emoji + "</div>";
    $("prize-title").textContent = prize.title;
    $("prize-text").textContent = "You won " + prize.name + "! Go and show Mum or Dad.";
    $("prize").hidden = false;
    fireworks(2500);
    K.say("You won " + prize.name + "! Go and show Mum or Dad!");
    var log = K.get("pg.prizes", []);
    log.unshift({ prize: prize.id, player: me.name, at: new Date().toISOString(), lesson: L.title });
    K.set("pg.prizes", log.slice(0, 100));
  }
  $("prize-ok").addEventListener("click", function () { $("prize").hidden = true; backToMenu(); });

  /* ---------- start ---------- */
  $("go-practice").addEventListener("click", function () { start("practice"); });
  $("go-quiz").addEventListener("click", function () { start("quiz"); });
  refreshChips();
  K.say(L.title + "! " + L.intro);
  if (K.fetchState) K.fetchState().then(refreshChips);
})();
</script>
