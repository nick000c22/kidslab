# Kids Lab: the site is plain files, plus one function for the family leaderboard.
[build]
  publish = "."
  command = "echo 'No build step'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Always fetch the latest app files; the service worker handles offline.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
